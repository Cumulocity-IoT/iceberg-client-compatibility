name: Compatibility run

on:
  schedule:
    # Mondays, 5 minutes after the lake's hourly compaction, so the next one falls after the run.
    - cron: "5 6 * * 1"
  workflow_dispatch:
    inputs:
      clients:
        description: "Clients to run, separated by spaces; empty runs all"
        required: false
        default: ""
      releases:
        description: "Raise every pin to the latest release first"
        type: boolean
        default: true

# Every run posts fixture data to the same test tenant; two at once would read each other's marker.
concurrency:
  group: fixtures
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: eu-latest-test
    timeout-minutes: 150
    env:
      CATALOG_URI: ${{ vars.CATALOG_URI }}
      CATALOG_WAREHOUSE: ${{ vars.CATALOG_WAREHOUSE }}
      CATALOG_TOKEN_URI: ${{ vars.CATALOG_TOKEN_URI }}
      CATALOG_SCOPE: ${{ vars.CATALOG_SCOPE }}
      CATALOG_CREDENTIAL: ${{ secrets.CATALOG_CREDENTIAL }}
      C8Y_BASEURL: ${{ vars.C8Y_BASEURL }}
      C8Y_TENANT: ${{ vars.C8Y_TENANT }}
      C8Y_USER: ${{ vars.C8Y_USER }}
      C8Y_PASSWORD: ${{ secrets.C8Y_PASSWORD }}
      DREMIO_URL: ${{ vars.DREMIO_URL }}
      DREMIO_USER: ${{ vars.DREMIO_USER }}
      DREMIO_PASSWORD: ${{ secrets.DREMIO_PASSWORD }}
      SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the engine images
        # StarRocks and Doris unpack to about 10 GB; the runner's preinstalled SDKs we do not use take more than that.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            clients/*/*.py
            harness/*.py
      - uses: actions/setup-go@v5
        if: hashFiles('clients/iceberg-go/go.mod') != ''
        with:
          go-version-file: clients/iceberg-go/go.mod
          cache-dependency-path: clients/iceberg-go/go.sum
      - name: Cache the engine downloads
        # Keyed on the pins alone, without restore keys, so a raised version replaces the old download.
        uses: actions/cache@v4
        with:
          path: |
            clients/trino/target/trino-server-core-*
            clients/clickhouse/target/clickhouse-*
          key: downloads-${{ hashFiles('clients/trino/run.sh', 'clients/clickhouse/run.sh') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.ivy2.5.2
            ~/.cargo/registry
            clients/datafusion/target
          key: clients-${{ hashFiles('clients/*/pom.xml', 'clients/*/Cargo.lock', 'clients/*/*.py') }}
          restore-keys: clients-
      - name: Self-test of the harness
        run: python3 -m unittest harness.test_harness
      - name: Raise the pins to the latest releases
        if: github.event_name == 'schedule' || inputs.releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m harness.releases --bump ${{ inputs.clients }}
      - name: Run the clients
        run: python3 -m harness.run ${{ inputs.clients }}
      - name: Publish the results
        if: always()
        run: |
          python3 -m harness.summary
          python3 -m harness.render
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: [noissue] - results of run ${{ github.run_id }}"
          git push
