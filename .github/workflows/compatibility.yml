name: Compatibility run

on:
  schedule:
    # Mondays, 5 minutes after the lake's hourly compaction, so the next one falls after the run.
    - cron: "5 6 * * 1"
  workflow_dispatch:
    inputs:
      clients:
        description: "Clients to run, separated by spaces; empty runs all"
        required: false
        default: ""
      releases:
        description: "Raise every pin to the latest release first"
        type: boolean
        default: true

# Every run posts fixture data to the same test tenant; two at once would read each other's marker.
concurrency:
  group: fixtures
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    environment: eu-latest-test
    timeout-minutes: 150
    env:
      CATALOG_URI: ${{ vars.CATALOG_URI }}
      CATALOG_WAREHOUSE: ${{ vars.CATALOG_WAREHOUSE }}
      CATALOG_TOKEN_URI: ${{ vars.CATALOG_TOKEN_URI }}
      CATALOG_SCOPE: ${{ vars.CATALOG_SCOPE }}
      CATALOG_CREDENTIAL: ${{ secrets.CATALOG_CREDENTIAL }}
      C8Y_BASEURL: ${{ vars.C8Y_BASEURL }}
      C8Y_TENANT: ${{ vars.C8Y_TENANT }}
      C8Y_USER: ${{ vars.C8Y_USER }}
      C8Y_PASSWORD: ${{ secrets.C8Y_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.ivy2.5.2
            ~/.cargo/registry
            clients/datafusion/target
          key: clients-${{ hashFiles('clients/*/pom.xml', 'clients/*/Cargo.lock', 'clients/*/*.py') }}
          restore-keys: clients-
      - name: Self-test of the harness
        run: python3 -m unittest harness.test_harness
      - name: Raise the pins to the latest releases
        if: github.event_name == 'schedule' || inputs.releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m harness.releases --bump ${{ inputs.clients }}
      - name: Run the clients
        run: python3 -m harness.run ${{ inputs.clients }}
      - name: Publish the results
        if: always()
        run: |
          python3 -m harness.summary
          python3 -m harness.render
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: [noissue] - results of run ${{ github.run_id }}"
          git push
