# The columns of the compatibility table, in display order. A column shows only once a result carries it,
# so the later-phase columns stay hidden until a client reports them. `meaning` is shown to readers below the
# table; it says what a working cell means for them, then how it is tested where that is not obvious.

[[column]]
id = "catalog-login"
group = "Connect"
title = "Login"
meaning = "Logs in to the catalog with the client ID and secret you issue for your tenant (OAuth2 client credentials) and lists the namespaces."

[[column]]
id = "s3"
group = "Connect"
title = "S3"
meaning = "Reads data files on Amazon S3 with the short-lived storage credentials the catalog hands out, with no storage keys or region of your own."

[[column]]
id = "adls"
group = "Connect"
title = "ADLS"
meaning = "Reads data files on Azure Data Lake Storage with the short-lived storage credentials the catalog hands out."

[[column]]
id = "refresh"
group = "Connect"
title = "Refresh"
meaning = "Renews the catalog token and the storage credentials before they expire, so a long job keeps working."

[[column]]
id = "long-session"
group = "Connect"
title = "Long session"
meaning = "Keeps reading after the real lifetimes of the catalog token (15 minutes) and the storage credentials (1 hour) have passed."

[[column]]
id = "cdc-tables"
group = "Read"
title = "CDC tables"
meaning = "Reads the change data capture tables (`cdc_*`), which record every change. Filters by time, by device and with NOT return counts that add up, also across a month boundary, where the data is partitioned."

[[column]]
id = "latest-tables"
group = "Read"
title = "Latest tables"
meaning = "Reads the `latest_inventory` tables, which hold the current state of each device. They are updated with equality and position deletes; a client that cannot apply them cannot read these tables, or returns outdated rows."

[[column]]
id = "schema-evolution"
group = "Read"
title = "Schema evolution"
meaning = "Reads columns that were added later: older rows return NULL, newer rows their value."

[[column]]
id = "freshness"
group = "Read"
title = "Freshness"
meaning = "Minutes until newly ingested data is visible in the client."

[[column]]
id = "incremental-read"
group = "Read"
title = "Incremental read"
meaning = "Reads only what changed since the last read, across updates and compactions of the table."

[[column]]
id = "decimal"
group = "Types"
title = "Decimal"
meaning = "Returns numbers, which the lake stores as `decimal(38,9)`, exactly, without rounding them through floating point."

[[column]]
id = "timestamps"
group = "Types"
title = "Timestamps"
meaning = "Returns timestamps as the same instant, to the millisecond, whatever the time zone of the session."

[[column]]
id = "nesting"
group = "Types"
title = "Nesting"
meaning = "Reads structured values: fields of objects nested up to 16 levels deep, and lists of objects."

[[column]]
id = "large-values"
group = "Types"
title = "Large values"
meaning = "Reads strings of up to 32,768 bytes, binary values, and tables with many columns."

[[column]]
id = "identifiers"
group = "Names"
title = "Identifiers"
meaning = "Finds tables and columns under their exact names: camelCase, escaped special characters such as `compat_x002EEscaped`, dashes, and SQL reserved words."

[[column]]
id = "views"
group = "Views"
title = "Views"
meaning = "Runs the views in the `view_*` namespaces, which turn nested fields into plain columns, and gets the same rows as from their base tables."
