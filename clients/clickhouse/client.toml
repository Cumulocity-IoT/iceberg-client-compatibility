name = "ClickHouse"
url = "https://clickhouse.com"
example = "example.py"
section = "engine"
# Release tags are v<version>-stable and v<version>-lts, with a four-part version (year.month.patch.build); only
# the -stable tags count, and the pin holds the bare version without the v and the suffix.
release = { github = "ClickHouse/ClickHouse", tag = 'v([0-9]+(?:\.[0-9]+)*)-stable' }
pin = { match = 'version="([0-9][^"]*)"' }
