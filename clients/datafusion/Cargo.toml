[package]
name = "datafusion-compat"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "datafusion-compat"
path = "src/main.rs"

[features]
# Workaround switch "tls": iceberg-catalog-rest builds reqwest without a TLS backend, so https catalog
# URIs fail; a direct reqwest dependency with a TLS feature unifies one in (apache/iceberg-rust#2888).
tls = ["dep:reqwest"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
iceberg = "=0.11.0"
iceberg-catalog-rest = "=0.11.0"
iceberg-datafusion = "=0.11.0"
iceberg-storage-opendal = { version = "=0.11.0", default-features = false, features = ["opendal-s3"] }
datafusion = "=54.1.0"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
regex = "1"
