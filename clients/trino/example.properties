# Trino catalog for the lake of a Cumulocity tenant: save it as etc/catalog/lake.properties on every Trino node.
# Trino substitutes ${ENV:...} from its environment, so the client secret stays out of the file; the settings
# are the ones in the README.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:CATALOG_URI}
iceberg.rest-catalog.warehouse=${ENV:CATALOG_WAREHOUSE}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:CATALOG_CREDENTIAL}
iceberg.rest-catalog.oauth2.server-uri=${ENV:CATALOG_TOKEN_URI}
iceberg.rest-catalog.oauth2.scope=${ENV:CATALOG_SCOPE}
# Sends X-Iceberg-Access-Delegation: vended-credentials and reads the data files with the vended credentials.
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
# Workaround s3-region: native S3 needs a region to load the catalog, and the vended credentials carry none.
#s3.region=<the AWS region of your lake, for example eu-central-1>
# Workaround case-insensitive-names: Trino looks up table names in lower case, such as c8y_temperature.
#iceberg.rest-catalog.case-insensitive-name-matching=true
