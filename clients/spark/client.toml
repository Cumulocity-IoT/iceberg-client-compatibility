name = "Apache Spark"
url = "https://spark.apache.org"
section = "engine"
release = { pypi = "pyspark" }
pin = { match = 'pyspark==([0-9][^"]*)' }
# A Spark line counts only once Iceberg publishes its runtime; the runtime version follows.
requires = { maven = "org.apache.iceberg:iceberg-spark-runtime-{minor}_2.13", pin = 'ICEBERG = "([^"]+)"' }
